name: guide_me
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.0.1
  flutter_svg: ^2.2.3
  intl: ^0.20.2
  pinput: ^6.0.1
  flutter_native_splash: ^2.4.7
  syncfusion_flutter_sliders: ^32.1.25
  syncfusion_flutter_datepicker: ^32.1.25
  flutter_credit_card: ^4.1.0
  flutter_rating_bar: ^4.0.1
  font_awesome_flutter: ^10.12.0
  lottie: ^3.3.2
  percent_indicator: ^4.2.5
  flutter_bloc: ^9.1.1
  dotted_border: ^3.1.0
  dropdown_search: ^6.0.2
  file_picker: ^10.3.10
  image_picker: ^1.2.1
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  linear_date_picker: ^0.0.2
  logger: ^2.5.0
  dio: ^5.8.0+1
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^7.0.0
  dartz: ^0.10.1
  shimmer: ^3.0.0
  dio_cache_interceptor: ^3.5.0
  dio_cache_interceptor_file_store: ^1.2.3
  path_provider: ^2.1.5
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  injectable_generator: ^2.12.0
  build_runner: ^2.12.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"


flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    
    - family: Montserrat
      fonts:
      - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
      - asset: assets/fonts/Montserrat/Montserrat-Light.ttf
        weight: 300
      - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
        weight: 500
      - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
        weight: 700
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
